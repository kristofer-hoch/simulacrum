name: Publish Artifacts to Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to use for publishing artifacts'
        required: true
        default: 'Development'
        type: environment
      release-tag:
        description: 'Release tag for the artifacts to publish'
        required: true
        type: string

permissions:
    actions: read
    contents: read

jobs:
    init:
        uses: ./.github/workflows/reusable-variables.yml
        with:
            environment: ${{ inputs.environment }}

    download-artifacts:
        needs: init
        runs-on: ${{ needs.init.outputs.runs-on }}
        environment: ${{ inputs.environment }}
        steps:
        -   name: Checkout Repository
            uses: actions/checkout@v4
            with:
                ref: '${{ inputs.release-tag }}'

        -   name: Read Release Metadata
            id: metadata
            uses: ActionsTools/read-json-action@main
            with:
                file_path: ${{ needs.init.outputs.release-metadata }}
        -   run: |
                echo "version:${{ steps.metadata.outputs.version}}" 
                echo "artifact-id: ${{ steps.metadata.outputs.artifact-id}}" 
                echo "artifact-url: ${{ steps.metadata.outputs.artifact-url}}" 
                echo "artifact-digest: ${{ steps.metadata.outputs.artifact-digest}}"

        -   name: Resolve Artifact Run
            id: artifact
            shell: bash
            env:
                ARTIFACT_URL: ${{ steps.metadata.outputs.artifact-url }}
            run: |
                if [[ "$ARTIFACT_URL" =~ /actions/runs/([0-9]+)/artifacts/[0-9]+/?$ ]]; then
                    echo "run-id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
                else
                    echo "Unable to determine the workflow run from artifact URL: $ARTIFACT_URL" >&2
                    exit 1
                fi

        -   name: Download Release Artifacts
            uses: actions/download-artifact@v8
            with:
                artifact-ids: ${{ steps.metadata.outputs.artifact-id }}
                github-token: ${{ github.token }}
                run-id: ${{ steps.artifact.outputs.run-id }}
                path: ${{ needs.init.outputs.dir-distribution }}
        
        -   name: Capture Distribution Directory Contents
            id: dirs
            run: |
                DIRS=$(find . -maxdepth 1 -type d -not -path '*/.*' -not -path '.' | jq -R -s -c 'split("\n") | del(.[] | select(. == ""))')
                echo "matrix=$DIRS" >> $GITHUB_OUTPUT
    
    process-artifacts:
        needs: [init, download-artifacts]
        runs-on: ${{ needs.init.outputs.runs-on }}
        environment: ${{ inputs.environment }}
        strategy:
            matrix:
                dir: ${{ fromJSON(needs.download-artifacts.outputs.matrix) }}
        steps:
        -   name: Initialize UiPath CLI Environment
            uses: ./.github/actions/initialize-uipath-cli

        -   name: UiPath Login
            env:
                UIPATH_AUTHORITY: ${{ vars.UIPATH_AUTHORITY }}
                UIPATH_ORGANIZATION: ${{ vars.UIPATH_ORGANIZATION }}
                UIPATH_TENANT_NAME: ${{ vars.UIPATH_TENANT_NAME }}
                UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
                UIPATH_SECRET: ${{ secrets.UIPATH_SECRET }}
            run: |
                echo "Logging into UiPath Orchestrator..."
                uip login \
                    --authority "$UIPATH_AUTHORITY" \
                    --organization "$UIPATH_ORGANIZATION" \
                    --tenant "$UIPATH_TENANT_NAME" \
                    --client-id env.UIPATH_CLIENT_ID \
                    --client-secret env.UIPATH_SECRET \
                    --output json

        -   name: Process Artifacts
            run: |
                echo "Processing artifacts in distribution directory..."
                for dir in ${{ needs.download-artifacts.outputs.matrix }}; do
                    echo "Processing directory: $dir"
                    sh ${{ needs.init.outputs.dir-scripts }}/deploy-orchestrator.sh $dir
                    # Add your artifact processing commands here
                done
