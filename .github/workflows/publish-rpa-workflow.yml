name: Publish Artifacts to Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to use for publishing artifacts'
        required: true
        default: 'Development'
        type: environment
      release-tag:
        description: 'Release tag for the artifacts to publish'
        required: true
        type: string

permissions:
    actions: read
    contents: read

jobs:
    init:
        uses: ./.github/workflows/reusable-variables.yml
        with:
            environment: ${{ inputs.environment }}

    download-artifacts:
        needs: init
        runs-on: ${{ needs.init.outputs.runs-on }}
        environment: ${{ inputs.environment }}
        outputs:
            matrix: ${{ steps.dirs.outputs.matrix }}
        steps:
        -   name: Checkout Repository
            uses: actions/checkout@v7
            with:
                ref: '${{ inputs.release-tag }}'

        -   name: Log Metadata File Contents
            run: cat ${{ needs.init.outputs.release-metadata }}

        -   name: Read Release Metadata
            id: metadata
            shell: bash
            env:
                METADATA_FILE: ${{ needs.init.outputs.release-metadata }}
            run: |
                python - "$METADATA_FILE" "$GITHUB_OUTPUT" <<'PY'
                import ast
                import json
                import sys

                metadata_file, github_output = sys.argv[1:]
                with open(metadata_file, encoding="utf-8") as file:
                    contents = file.read()

                try:
                    metadata = json.loads(contents)
                except json.JSONDecodeError:
                    metadata = ast.literal_eval(contents)

                required_fields = (
                    "version",
                    "run-id",
                    "artifact-id",
                    "artifact-url",
                    "artifact-digest",
                )
                if not isinstance(metadata, dict):
                    raise ValueError("Release metadata must be an object")

                missing_fields = [
                    field for field in required_fields if not metadata.get(field)
                ]
                if missing_fields:
                    raise ValueError(
                        f"Release metadata is missing required fields: {', '.join(missing_fields)}"
                    )

                with open(github_output, "a", encoding="utf-8") as output:
                    for field in required_fields:
                        print(f"{field}={metadata[field]}", file=output)
                PY
        -   run: |
                echo "version:${{ steps.metadata.outputs.version}}" 
                echo "run-id: ${{ steps.metadata.outputs.run-id}}"
                echo "artifact-id: ${{ steps.metadata.outputs.artifact-id}}" 
                echo "artifact-url: ${{ steps.metadata.outputs.artifact-url}}" 
                echo "artifact-digest: ${{ steps.metadata.outputs.artifact-digest}}"

        -   name: Download Release Artifacts
            uses: actions/download-artifact@v8
            with:
                artifact-ids: ${{ steps.metadata.outputs.artifact-id }}
                github-token: ${{ github.token }}
                run-id: ${{ steps.metadata.outputs.run-id }}
                path: ${{ needs.init.outputs.dir-distribution }}
        
        -   name: Capture Distribution Directory Contents
            id: dirs
            shell: bash
            env:
                DISTRIBUTION_DIR: ${{ needs.init.outputs.dir-distribution }}
            run: |
                DIRS=$(find "$DISTRIBUTION_DIR" -mindepth 1 -maxdepth 1 -type d -not -path '*/.*' | jq -R -s -c 'split("\n") | map(select(length > 0))')
                echo "matrix=$DIRS" >> "$GITHUB_OUTPUT"
    
    process-artifacts:
        needs: [init, download-artifacts]
        runs-on: ${{ needs.init.outputs.runs-on }}
        environment: ${{ inputs.environment }}
        strategy:
            matrix:
                dir: ${{ fromJSON(needs.download-artifacts.outputs.matrix) }}
        steps:
        -   name: Checkout Repository
            uses: actions/checkout@v7
            with:
                ref: '${{ inputs.release-tag }}'

        -   name: Initialize UiPath CLI Environment
            uses: ./.github/actions/initialize-uipath-cli

        -   name: Create Configuration File
            env:
                UIPATH_AUTHORITY: ${{ vars.UIPATH_AUTHORITY }}
                UIPATH_ORGANIZATION: ${{ vars.UIPATH_ORGANIZATION }}
                UIPATH_TENANT_NAME: ${{ vars.UIPATH_TENANT_NAME }}
                UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
                UIPATH_SECRET: ${{ secrets.UIPATH_SECRET }}
            run: |
                echo "{'authority': '$UIPATH_AUTHORITY','organization': '$UIPATH_ORGANIZATION','tenant': '$UIPATH_TENANT_NAME','client-id': '$UIPATH_CLIENT_ID','client-secret': '$UIPATH_SECRET'}" > ${{ needs.init.outputs.dir-scripts }}/deploy-orchestrator-config.json

        -   name: Process Artifacts
            env:
                ARTIFACT_DIR: ${{ matrix.dir }}
                DEPLOY_SCRIPT: ${{ needs.init.outputs.dir-scripts }}/deploy-orchestrator.ts
                CONFIG_FILE: ${{ needs.init.outputs.dir-scripts }}/deploy-orchestrator-config.json
            run: |
                echo "Processing artifacts in distribution directory..."
                echo "Processing directory: $ARTIFACT_DIR"
                node "$DEPLOY_SCRIPT" "$ARTIFACT_DIR" --config "$CONFIG_FILE"
