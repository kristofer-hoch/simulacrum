name: (Reusable Only) Publish Artifacts to Orchestrator

on:
  workflow_call: 
    inputs:
        runs-on:
            description: 'The type of machine to run the job on'
            required: true
            default: 'ubuntu-latest'
            type: string
        environment:
            description: 'Environment to use for publishing artifacts'
            required: true
            default: 'Development'
            type: string
        release-tag:
            description: 'Release tag for the artifacts to publish'
            required: true
            type: string
    secrets:
        UIPATH_CLIENT_ID:
            description: 'UiPath Client ID for Orchestrator authentication'
            required: true
        UIPATH_SECRET:
            description: 'UiPath Secret for Orchestrator authentication'
            required: true

permissions:
    actions: read
    contents: read

jobs:
    init:
        uses: ./.github/workflows/reusable-variables.yml
        with:
            environment: ${{ inputs.environment }}
            runs-on: ${{ inputs.runs-on }}

    motd:
        runs-on: ${{ needs.init.outputs.runs-on }}
        steps:
        -   name: Display Publish Workflow Information
            run: |
                echo "Build Agent OS: ${{ needs.init.outputs.runs-on }}"
                echo "Environment: ${{ inputs.environment }}"
                echo "Release Tag: ${{ inputs.release-tag }}"
                echo ""

    download-artifacts:
        needs: init
        runs-on: ${{ needs.init.outputs.runs-on }}
        environment: ${{ inputs.environment }}
        steps:
        -   name: Checkout Repository
            uses: actions/checkout@v7
            with:
                ref: '${{ inputs.release-tag }}'

        -   name: Log Metadata File Contents
            run: cat ${{ needs.init.outputs.release-metadata }}

        -   name: Read Release Metadata
            id: metadata
            env:
                METADATA_FILE: ${{ needs.init.outputs.release-metadata }}
                METADATA_READER: ${{ needs.init.outputs.dir-scripts }}/read-release-metadata.ts
            run: |
                node "$METADATA_READER" \
                    --metadata-file "$METADATA_FILE" \
                    --github-output "$GITHUB_OUTPUT"
        -   run: |
                echo "version: ${{ steps.metadata.outputs.version}}" 
                echo "run-id: ${{ steps.metadata.outputs.run-id}}"
                echo "artifact-id: ${{ steps.metadata.outputs.artifact-id}}" 
                echo "artifact-url: ${{ steps.metadata.outputs.artifact-url}}" 
                echo "artifact-digest: ${{ steps.metadata.outputs.artifact-digest}}"

        -   name: Download Release Artifacts
            uses: actions/download-artifact@v8
            with:
                artifact-ids: ${{ steps.metadata.outputs.artifact-id }}
                github-token: ${{ github.token }}
                run-id: ${{ steps.metadata.outputs.run-id }}
                path: ${{ needs.init.outputs.dir-distribution }}

        -   name: List Downloaded Artifacts
            run: |
                echo "Downloaded artifacts:"
                ls -lR ${{ needs.init.outputs.dir-distribution }}

        -   name: Create Configuration File
            env:
                UIPATH_AUTHORITY: ${{ vars.UIPATH_AUTHORITY }}
                UIPATH_ORGANIZATION: ${{ vars.UIPATH_ORGANIZATION }}
                UIPATH_TENANT_NAME: ${{ vars.UIPATH_TENANT_NAME }}
                UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
                UIPATH_SECRET: ${{ secrets.UIPATH_SECRET }}
                CONFIG_FILE: ${{ needs.init.outputs.dir-distribution }}/deploy-orchestrator-config.json
            run: |
                echo "Id: " & secrets.UIPATH_CLIENT_ID
                node --input-type=module <<'NODE'
                import { writeFileSync } from "node:fs";

                const config = {
                    authority: process.env.UIPATH_AUTHORITY,
                    organization: process.env.UIPATH_ORGANIZATION,
                    tenant: process.env.UIPATH_TENANT_NAME,
                    "client-id": process.env.UIPATH_CLIENT_ID,
                    "client-secret": process.env.UIPATH_SECRET,
                };
                writeFileSync(process.env.CONFIG_FILE, JSON.stringify(config));
                NODE
                chmod 600 "$CONFIG_FILE"

        -   name: Initialize UiPath CLI Environment
            uses: ./.github/actions/initialize-uipath-cli

        -   name: Process Artifacts
            env:
                DEPLOY_SCRIPT: ${{ needs.init.outputs.dir-scripts }}/deploy-orchestrator.ts
                CONFIG_FILE: ${{ needs.init.outputs.dir-distribution }}/deploy-orchestrator-config.json
                ARTIFACT_DIR: ${{ needs.init.outputs.dir-distribution }}
            run: node "$DEPLOY_SCRIPT" "$ARTIFACT_DIR" --config "$CONFIG_FILE"
