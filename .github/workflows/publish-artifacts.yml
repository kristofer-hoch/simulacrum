name: Publish Artifacts to Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to use for publishing artifacts'
        required: true
        default: 'Development'
        type: environment
      run_id:
        description: 'Successful build workflow run ID containing the artifacts'
        required: true
        type: string

permissions:
    actions: read
    contents: read

jobs:
    publish-artifacts:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        steps:
        -   name: Checkout Repository
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

        -   name: Initialize UiPath CLI Environment
            uses: ./.github/actions/initialize-uipath-cli

        -   name: Download Build Artifacts
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            with:
                run-id: ${{ inputs.run_id }}
                github-token: ${{ github.token }}
                path: artifact-distribution
                merge-multiple: true

        -   name: UiPath Login
            env:
                UIPATH_AUTHORITY: ${{ vars.UIPATH_AUTHORITY }}
                UIPATH_ORGANIZATION: ${{ vars.UIPATH_ORGANIZATION }}
                UIPATH_TENANT_NAME: ${{ vars.UIPATH_TENANT_NAME }}
                UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
                UIPATH_SECRET: ${{ secrets.UIPATH_SECRET }}
            run: |
                uip login \
                    --authority "$UIPATH_AUTHORITY" \
                    --organization "$UIPATH_ORGANIZATION" \
                    --tenant "$UIPATH_TENANT_NAME" \
                    --client-id env.UIPATH_CLIENT_ID \
                    --client-secret env.UIPATH_SECRET \
                    --output json

        -   name: Publish Packages to Orchestrator
            shell: bash
            run: |
                mapfile -d '' packages < <(
                    find artifact-distribution -type f -name '*.nupkg' -print0
                )

                if (( ${#packages[@]} == 0 )); then
                    echo "No .nupkg files were found in the downloaded artifacts." >&2
                    exit 1
                fi

                for package in "${packages[@]}"; do
                    uip or packages upload "$package" --output json
                done
