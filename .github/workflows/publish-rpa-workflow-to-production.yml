name: Publish Artifacts to Orchestrator (Production)

on:
    workflow_dispatch: 
        inputs:
            release-tag:
                description: 'Release tag for the artifacts to publish'
                required: true
                type: string

jobs:
    publish-to-production:
        uses: ./.github/workflows/reusable-publish-rpa-workflow.yml
        secrets:
            UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
            UIPATH_SECRET: ${{ secrets.UIPATH_SECRET }}
        with:
            environment: 'Production'
            runs-on: 'ubuntu-latest'
            release-tag: ${{ inputs.release-tag }}
       