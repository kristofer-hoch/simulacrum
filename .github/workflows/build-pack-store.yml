name: Build, Pack, and Store Artifacts
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
    contents: write
jobs:
    init:
        uses: ./.github/workflows/reusable-uipath-cli-initialization.yml
        with:
            environment: Development

    build-pack-store:
        needs: init
        environment: ${{ needs.init.outputs.environment }}
        runs-on: ${{ needs.init.outputs.runs-on }}
        steps:
        -   name: Log Variables
            run: |
                echo "Environment: ${{ needs.init.outputs.environment }}"
                echo "Runs-on: ${{ needs.init.outputs.runs-on }}"
                echo "Dir Deployment: ${{ needs.init.outputs.dir-deployment }}"
                echo "Dir Scripts: ${{ needs.init.outputs.dir-scripts }}"
                echo "Dir Configs: ${{ needs.init.outputs.dir-configs }}"
                echo "Dir Generated: ${{ needs.init.outputs.dir-generated }}"
                echo "Dir Distribution: ${{ needs.init.outputs.dir-distribution }}"
                echo "Dir RPA Simulacrum: ${{ needs.init.outputs.dir-rpa-simulacrum }}"

        -   name: Check out repository
            uses: actions/checkout@v4

        -   name: UiPath Login
            run: |
                echo "Logging into UiPath Orchestrator..."
                echo "uip login  --authority ${{ vars.UIPATH_AUTHORITY }} --organization ${{ vars.UIPATH_ORGANIZATION }} --tenant ${{ vars.UIPATH_TENANT_NAME }}"
                uip login \
                    --authority ${{ vars.UIPATH_AUTHORITY }} \
                    --organization ${{ vars.UIPATH_ORGANIZATION }} \
                    --tenant ${{ vars.UIPATH_TENANT_NAME }}  \
                    --client-id "${{ secrets.UIPATH_CLIENT_ID }}" \
                    --client-secret "${{ secrets.UIPATH_SECRET }}"

        -   name: Build the Project
            run: uip rpa build ${{ needs.init.outputs.dir-rpa-simulacrum }} 


        -   name: Create Version Tag
            id: create-tag
            run: node ${{ needs.init.outputs.dir-scripts }}/create-release-tag.ts
            
        -   name: Generate Deployment Configurations
            run: |
                node ${{ needs.init.outputs.dir-scripts }}/generate-deployment-configurations.ts \
                    --config-dir ${{ needs.init.outputs.dir-configs }} \
                    --output-dir ${{ needs.init.outputs.dir-generated }} \
                    --global-config ${{ needs.init.outputs.dir-deployment }}/global.deploy.json

        -   name: Pack the Project
            run: |
                node ${{ needs.init.outputs.dir-scripts }}/create-nuget-packages.ts \
                    --config-dir ${{ needs.init.outputs.dir-generated }} \
                    --project-dir ${{ needs.init.outputs.dir-rpa-simulacrum }} \
                    --release-version ${{ env.RELEASE_TAG }}

        -   name: Store Artifacts
            uses: actions/upload-artifact@v4
            with:
                name: rpa-artifacts-${{ env.RELEASE_TAG }}
                path: ${{ needs.init.outputs.dir-distribution }}/**
